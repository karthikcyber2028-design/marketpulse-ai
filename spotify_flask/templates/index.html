{% extends "base.html" %}

{% block content %}
<script>window.SONGS = {{ songs|tojson }};</script>
<section class="home">
    <header class="search-bar">
        <input type="text" id="searchInput" placeholder="Search songs, artists…" oninput="filterSongs()">
    </header>
    <div class="categories">
        <span class="cat-btn active" data-category="all">All</span>
        <span class="cat-btn" data-category="Telugu">Telugu</span>
        <span class="cat-btn" data-category="Tamil">Tamil</span>
        <span class="cat-btn" data-category="Hindi">Hindi</span>
        <span class="cat-btn" data-category="English">English</span>
    </div>
    <div class="song-grid" id="songGrid">
        {% for song in songs %}
        <div class="song-card" data-category="{{ song.category }}" data-id="{{ song.id }}">
            <span class="song-title">{{ song.title }}</span>
            <span class="song-artist">{{ song.artist }}</span>
        </div>
        {% endfor %}
    </div>
</section>

<!-- Music Player -->
<div class="player" id="player">
    <div class="current-song">
        <span id="currentTitle"></span> - <span id="currentArtist"></span>
    </div>
    <button class="prev" id="prevBtn">⏮️</button>
    <button class="play-pause" id="playBtn">▶️</button>
    <button class="next" id="nextBtn">⏭️</button>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="1">
    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>
    <span id="currentTime">0:00</span>
    <span id="duration">0:00</span>
</div>
{% endblock %}

<script src="{{ url_for('static', filename='app.js') }}"></script>
